name: Feature request
description: Suggest a new tool, workflow, or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        OpenSolar MCP only exposes operations whose request contract is established by the [OpenSolar API documentation](https://developers.opensolar.com/api/) or recorded live verification. Links to the relevant documentation make a request much easier to act on.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task an agent or user should be able to complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: The tool, argument, or output change you have in mind.
  - type: textarea
    id: evidence
    attributes:
      label: OpenSolar API documentation
      description: Links to the endpoint documentation that supports this, especially for write operations.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
