name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package and server.json versions
        run: |
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          test "v$PKG" = "$GITHUB_REF_NAME"
          test "$PKG" = "$SRV"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish to npm (trusted publishing adds provenance)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@alignco/opensolar-mcp@$PKG" version; then
            echo "npm already has ${PKG}; skipping publish"
          else
            npm publish
          fi
      - name: Install mcp-publisher (pinned version and checksum)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Wait until npm serves this version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if npm view "@alignco/opensolar-mcp@$PKG" version; then
              echo "npm is serving ${PKG}"
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done
          echo "npm did not serve ${PKG}" >&2
          exit 1
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
