name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package and server.json versions
        run: |
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          test "v$PKG" = "$GITHUB_REF_NAME"
          test "$PKG" = "$SRV"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish to npm (trusted publishing adds provenance)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@alignco/opensolar-mcp@$PKG" version; then
            echo "npm already has ${PKG}; skipping publish"
          else
            npm publish
          fi
      - name: Install mcp-publisher (pinned version and checksum)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait until npm serves this version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if npm view "@alignco/opensolar-mcp@$PKG" version; then
              echo "npm is serving ${PKG}"
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done
          echo "npm did not serve ${PKG}" >&2
          exit 1
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Check whether this image version is already in GHCR
        id: ghcr
        run: |
          PKG="$(node -p "require('./package.json').version")"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          image="ghcr.io/align-software-company/opensolar-mcp:${PKG}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${image} already exists; skipping push"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the image
        id: image
        if: steps.ghcr.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/align-software-company/opensolar-mcp:${{ steps.ghcr.outputs.version }}
            ghcr.io/align-software-company/opensolar-mcp:latest
      - name: Attest the image build
        if: steps.ghcr.outputs.exists != 'true'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/align-software-company/opensolar-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Image must be publicly pullable
        run: |
          PKG="$(node -p "require('./package.json').version")"
          repo="align-software-company/opensolar-mcp"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).token||""))' || true)"
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${PKG}"; then
            echo "ghcr.io/${repo}:${PKG} is not publicly pullable. Make the GHCR package public, then re-run this job." >&2
            exit 1
          fi
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          printf '\n**Full changelog:** https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
      - name: Create the GitHub Release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest
