name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:all
      - run: pnpm build
      - run: node dist/index.js --list-tools
      - run: npm pack
      - run: node scripts/release-smoke.mjs
      - run: pnpm test:docker
      - if: always()
        run: rm -f ./*.tgz
